models:
  - name: int_pagos_por_pedido
    description: >
      Un pedido por fila con el total de sus pagos. Agrega stg_tienda__pagos antes de
      cruzar con pedidos, para que el JOIN del mart no multiplique filas.
    config:
      materialized: ephemeral
    columns:
      - name: pedido_id
        description: Pedido al que se atribuyen los pagos.
      - name: importe
        description: '{{ doc("importe_cobrado") }}'
